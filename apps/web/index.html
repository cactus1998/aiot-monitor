<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="機台戰情室：模擬工廠機台即時監控、歷史查詢與告警" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231d4ed8'/><path d='M6 22l6-8 5 5 4-6 5 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <title>機台戰情室 AIoT Monitor</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = JSON.parse(localStorage.getItem('aiot:ui') || 'null')
        const theme = saved && saved.version === 1 ? saved.data.theme : null
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
